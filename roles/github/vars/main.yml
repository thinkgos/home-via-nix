  - name: "dbx"
    description: "lightweight cross-platform database client for 100+ databases"
    repo: "t8y2/dbx"
    version: 0.6.55
    tag_prefix: "v"
    package_name: "dbx"
    debian_pattern: "DBX___VERSION___amd64.deb"
    redhat_pattern: "DBX-__VERSION__-1.x86_64.rpm.rpm"

  - name: "zedis"
    description: "A blazing-fast, native Redis GUI built with Rust and GPUI"
    repo: "vicanso/zedis"
    version: 0.15.0
    tag_prefix: "v"
    package_name: "zedis"
    debian_pattern: "zedis-linux-x86_64.deb"
    redhat_pattern: "zedis-linux-x86_64.rpm"

  - name: "chipmunk"
    description: "a log analysis tool"
    repo: "esrlabs/chipmunk"
    version: 4.4.0
    tag_prefix: ""
    package_name: "chipmunk"
    debian_pattern: "chipmunk@__VERSION__-linux-amd64.deb"
    redhat_pattern: "chipmunk@__VERSION__-linux-x86_64.rpm"

  - name: "cc-switch"
    description: "cc-switch"
    repo: "farion1231/cc-switch"
    version: 4.0.20
    package_name: "cc-switch"
    debian_pattern: "CC-Switch-v__VERSION__-Linux-x86_64.deb"
    redhat_pattern: "CC-Switch-v__VERSION__-Linux-x86_64.rpm"

  - name: "opencode"
    description: "code agent"
    repo: "anomalyco/opencode"
    version: 1.19.4
    binary_name: "opencode"
    binary_pattern: "opencode-linux-x64.tar.gz"
