  - name: "Readest"
    description: "Readest is a modern, feature-rich ebook reader designed for avid readers offering seamless cross-platform access, powerful tools, and an intuitive interface to elevate your reading experience."
    repo: "readest/readest"
    version: 0.12.16
    tag_prefix: "v"
    package_name: "readest"
    debian_pattern: "Readest___VERSION___amd64.deb"
    redhat_pattern: "Readest-__VERSION__-1.x86_64.rpm"

  - name: "Handy"
    description: "A free, open source, and extensible speech-to-text application that works completely offline."
    repo: "cjpais/Handy"
    version: 0.9.8
    tag_prefix: "v"
    package_name: "handy"
    debian_pattern: "Handy___VERSION___amd64.deb"
    redhat_pattern: "Handy-__VERSION__-1.x86_64.rpm"

  - name: "chipmunk"
    description: "a log analysis tool"
    repo: "esrlabs/chipmunk"
    version: 4.4.0
    tag_prefix: ""
    package_name: "chipmunk"
    debian_pattern: "chipmunk@__VERSION__-linux-amd64.deb"
    redhat_pattern: "chipmunk@__VERSION__-linux-x86_64.rpm"

  - name: "zedis"
    description: "A blazing-fast, native Redis GUI built with Rust and GPUI"
    repo: "vicanso/zedis"
    version: 0.15.1
    tag_prefix: "v"
    package_name: "zedis"
    debian_pattern: "zedis-linux-x86_64.deb"
    redhat_pattern: "zedis-linux-x86_64.rpm"

  - name: "motrix"
    description: "A full-featured download manager."
    repo: "agalwood/Motrix"
    version: 2.1.1
    tag_prefix: "v"
    package_name: "motrix"
    debian_pattern: "Motrix___VERSION___amd64.deb"
    redhat_pattern: "Motrix-__VERSION__.x86_64.rpm"

  - name: "dbx"
    description: "lightweight cross-platform database client for 100+ databases"
    repo: "t8y2/dbx"
    version: 0.6.61
    tag_prefix: "v"
    package_name: "dbx"
    debian_pattern: "DBX___VERSION___amd64.deb"
    redhat_pattern: "DBX-__VERSION__-1.x86_64.rpm.rpm"

  - name: "cc-switch"
    description: "cc-switch"
    repo: "farion1231/cc-switch"
    version: 4.0.22
    package_name: "cc-switch"
    debian_pattern: "CC-Switch-v__VERSION__-Linux-x86_64.deb"
    redhat_pattern: "CC-Switch-v__VERSION__-Linux-x86_64.rpm"

  - name: "opencode"
    description: "code agent"
    repo: "anomalyco/opencode"
    version: 2.2.2
    binary_name: "opencode"
    binary_pattern: "opencode-linux-x64.tar.gz"
