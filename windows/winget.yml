# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# winget configure --file .\windows/winget.yml --accept-configuration-agreements --silent
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: install-vscode
      directives:
        description: 安装 Visual Studio Code
      settings:
        id: XP9KHM4BK9FZ7Q
        source: msstore
        ensure: Present

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: install-git
      directives:
